name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para el análisis de "new code"
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Cachear paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Etapa "Validación" (lineamiento 7.2): compila y falla rápido si no compila.
      - name: Compilar
        run: ./mvnw -B compile

      # Etapa "Calidad" (lineamiento 7.2): tests + cobertura (JaCoCo) + Quality Gate de SonarCloud.
      - name: Tests y cobertura
        run: ./mvnw -B test

      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      # No falla el build todavía si el Quality Gate no pasa — eso se activa como
      # "required status check" en branch protection una vez que el equipo confirme
      # que el Gate está bien calibrado (ver HANDOFF, sección 7).
