
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookly_test
          POSTGRES_USER: bookly_test
          POSTGRES_PASSWORD: bookly_test_local_2026
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bookly_test -d bookly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Cachear paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Verificar conexion PostgreSQL
        env:
          PGPASSWORD: bookly_test_local_2026
        run: |
          pg_isready -h localhost -p 55432 -U bookly_test -d bookly_test
          psql -h localhost -p 55432 -U bookly_test -d bookly_test \
            -c "SELECT current_database(), version();"

      - name: Compilar
        run: ./mvnw -B compile

      - name: Tests y cobertura
        run: ./mvnw -B clean test

      - name: Analisis SonarCloud
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
