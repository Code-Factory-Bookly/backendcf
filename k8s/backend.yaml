apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookly-api
  namespace: bookly
  labels:
    app.kubernetes.io/name: bookly-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookly-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookly-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          # Reemplazar por la imagen publicada en el registro del equipo.
          image: bookly/backendcf:0.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://bookly-postgres:5432/backendcf
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bookly-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookly-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookly-secrets
                  key: JWT_SECRET
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bookly-secrets
                  key: MFA_ENCRYPTION_KEY
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 20
            timeoutSeconds: 3
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bookly-api
  namespace: bookly
  labels:
    app.kubernetes.io/name: bookly-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bookly-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
