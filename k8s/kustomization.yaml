apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookly

resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - prometheus.yaml
  - grafana.yaml

configMapGenerator:
  - name: bookly-prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
  - name: bookly-grafana-datasource
    files:
      - prometheus.yml=config/prometheus-datasource.yml
  - name: bookly-grafana-dashboard-provider
    files:
      - bookly.yml=config/dashboard-provider.yml
  - name: bookly-grafana-dashboard
    files:
      - bookly-overview.json=config/bookly-overview.json
