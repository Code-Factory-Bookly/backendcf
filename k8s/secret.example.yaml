# Plantilla. No contiene secretos reales y no se incluye en kustomization.yaml.
# Crear el secreto real con kubectl create secret generic bookly-secrets ...
apiVersion: v1
kind: Secret
metadata:
  name: bookly-secrets
  namespace: bookly
type: Opaque
stringData:
  POSTGRES_USER: backendcf
  POSTGRES_PASSWORD: replace-me
  JWT_SECRET: replace-with-a-long-random-secret
  MFA_ENCRYPTION_KEY: replace-with-a-32-byte-key
