# =============================================================================
# SonarCloud / SonarQube project properties for Bookly BackendCF
# =============================================================================
# Este archivo configura el analisis estatico de Sonar. CI lo invoca con:
#
#   ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
#
# Las credenciales (SONAR_TOKEN) se inyectan desde secrets en GitHub Actions.
# =============================================================================

# Identificacion del proyecto en SonarCloud (leida tambien desde pom.xml)
sonar.projectKey=Code-Factory-Bookly_backendcf
sonar.organization=code-factory-bookly
sonar.projectName=Bookly BackendCF
sonar.projectDescription=Backend de la plataforma de reservas de servicios Bookly (EAV-10 Caso 14)
sonar.projectVersion=0.0.1-SNAPSHOT

# Codigo fuente y bytecode
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=17
sonar.java.target=17

# Excluir del analisis:
# - Recursos generados, migraciones, target/, lombok
# - Modulo quality/ (tooling interno, no logica de negocio)
sonar.exclusions=\
  src/main/resources/**,\
  target/**,\
  **/generated/**,\
  **/lombok/**,\
  **/quality/**

sonar.test.exclusions=\
  src/test/resources/**,\
  qa-tests/**

# JaCoCo como proveedor de cobertura
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Analisis incremental basado en Git (sonar-scanner detecta el SHA automaticamente)
sonar.scm.provider=git
sonar.scm.revision=${CI_COMMIT_SHA}

# Quality Gate: heredar del definido en SonarCloud
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Excluir archivos generados por el framework
sonar.cpd.exclusions=\
  **/dto/**,\
  **/model/BookingStatus.java,\
  **/model/BookingRescheduledEvent.java

# =============================================================================
# Reglas excluidas con justificacion
# =============================================================================
# java:S4502 - CSRF protection should be enabled for state-changing methods
#
#   Por que se excluye:
#     Esta API es 100% stateless: usa tokens JWT bearer en el header
#     Authorization (ADR-009). No emite sesiones JSESSIONID ni cookies, y
#     Spring Security STATELESS esta configurado explicitamente.
#     CSRF protege contra ataques basados en cookies/sesion de navegador,
#     escenario que no aplica aqui porque las requests autenticadas llevan
#     Authorization: Bearer <token> que un atacante CSRF no podria forzar
#     desde un formulario en otro origen.
#
#   Como alternativa, el endpoint usa autenticacion Bearer-only y el token
#   JWT se valida contra la firma. Mantener csrf() habilitado en este
#   contexto solo agrega ruido en logs sin beneficio de seguridad real.
#
#   Referencias:
#     - ADR-009 (docs/ADR-009-jwt-manual-vs-libreria.md): decision de JWT
#       sobre sesiones de servidor.
#     - Spring Security referencia: stateless APIs con bearer tokens no
#       requieren CSRF (ver docs.spring.io/spring-security/reference/
#       servlet/exploits/csrf.html#csrf-when).
# =============================================================================
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=**/SecurityConfiguration.java

# ============================================================
# Metricas objetivo (referencia; el Quality Gate real vive en SonarCloud)
# ============================================================
# Estas son las metas que el equipo debe mantener segun los requisitos
# del Sprint 2 / Sprint 3:
#
#   1) Cobertura de pruebas unitarias >= 65% (actual Sonar: 91.6% global,
#      93.9% line coverage, 80.4% branch coverage)
#   2) Deuda tecnica <= 2 dias en nuevo codigo (actual Sonar: sqale_index=0)
#   3) Complejidad ciclomatica < 50 (actual max: 46 en MfaService)
#   4) Severidad de hallazgos: ninguno bloqueador ni critico en OPEN
#      (resuelto: el unico CRITICAL era S4502 CSRF, excluido con justificacion)
#   5) Cero vulnerabilidades criticas (actual: 0 con la exclusion de S4502)
#
# Ver docs/QUALITY-STATUS.md para el estado historico.
# ============================================================