spring.application.name=backendcf
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backendcf}
spring.datasource.username=${DB_USERNAME:?DB_USERNAME debe estar configurado}
spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD debe estar configurado}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
# El equipo trabaja en paralelo con rangos de version por persona (docs/PLAN-SPRINT-2.md, seccion 5):
# una migracion con numero menor puede desplegarse despues de otra con numero mayor ya aplicada.
spring.flyway.out-of-order=true
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
app.cors.allowed-origins=${FRONTEND_URL:http://127.0.0.1:5173,http://localhost:5173}

security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
booking.cancellation.min-advance-minutes=${BOOKING_CANCELLATION_MIN_ADVANCE_MINUTES:120}