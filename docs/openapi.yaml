openapi: 3.0.3
info:
  title: Bookly Backend API
  version: 1.0.0
  description: >-
    API REST versionada del Caso 14 para HU-01, HU-02, HU-03, HU-04, HU-06, HU-07, HU-08,
    HU-09, HU-17, HU-18, HU-19, HU-20, HU-21 y HU-22. HU-10 no agrega endpoints REST:
    sus notificaciones se procesan internamente a partir de eventos de reserva.
externalDocs:
  description: Diseño y contrato interno de notificaciones de HU-10
  url: HU-10-notificaciones.md
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
  - name: Users
  - name: Platform
  - name: Services
  - name: Professionals
  - name: Schedule
  - name: Audit
  - name: Reservas
  - name: Availability
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar cliente
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCustomerRequest' }
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterCustomerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '423': { $ref: '#/components/responses/LockedError' }
  /auth/password:
    put:
      tags: [ Auth ]
      summary: Cambiar la propia contraseña
      description: Requiere la contraseña actual. No hay recuperación por correo todavía; ver /usuarios/{userId}/clave/restablecer.
      operationId: changeOwnPassword
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Contraseña cambiada }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/mfa/enroll:
    post:
      tags: [ Auth ]
      summary: Iniciar el enrolamiento del segundo factor
      description: >-
        Recibe el mfaToken que entregó /auth/login cuando mfaSetupRequired es true. Genera el
        secreto TOTP (sin persistir todavía) y la URI otpauth para el QR.
      operationId: mfaEnroll
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollRequest' }
      responses:
        '200':
          description: Secreto generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/mfa/enroll/confirm:
    post:
      tags: [ Auth ]
      summary: Confirmar el enrolamiento con el primer código
      description: Valida el primer código TOTP, activa el MFA y entrega la sesión ya autenticada más los códigos de recuperación (se muestran una sola vez).
      operationId: mfaConfirmEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: MFA activado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaConfirmResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/mfa/verify:
    post:
      tags: [ Auth ]
      summary: Verificar el código de un login con MFA ya enrolado
      operationId: mfaVerify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Sesión autenticada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/mfa/skip:
    post:
      tags: [ Auth ]
      summary: Omitir el enrolamiento del segundo factor por esta vez
      description: No marca el MFA como activo, así que el siguiente login vuelve a ofrecer este mismo paso (ADR-010).
      operationId: mfaSkip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollRequest' }
      responses:
        '200':
          description: Sesión autenticada sin MFA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /mfa/recovery-codes/estado:
    get:
      tags: [ Auth ]
      summary: Consultar cuántos códigos de recuperación quedan
      description: >-
        Distinta de /auth/mfa/**: esta ruta la usa un ADMIN ya autenticado para administrar su
        propio segundo factor, no un mfaToken de login a medias.
      operationId: mfaRecoveryStatus
      security: [ { bearerAuth: [ ] } ]
      responses:
        '200':
          description: Códigos restantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryStatusResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /mfa/recovery-codes/regenerar:
    post:
      tags: [ Auth ]
      summary: Regenerar los códigos de recuperación
      description: Invalida los códigos anteriores. Requiere un código TOTP válido para confirmar.
      operationId: mfaRegenerateRecoveryCodes
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRegenerateRequest' }
      responses:
        '200':
          description: Códigos nuevos (se muestran una sola vez)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodesResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /mfa/desactivar:
    post:
      tags: [ Auth ]
      summary: Desactivar el segundo factor
      description: Requiere la contraseña y un código TOTP válido.
      operationId: mfaDisable
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaDisableRequest' }
      responses:
        '204': { description: MFA desactivado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /platform/setup:
    post:
      tags: [Platform]
      summary: Aprovisionar la plataforma una sola vez
      operationId: setupPlatform
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformSetupRequest' }
      responses:
        '201':
          description: Plataforma creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSetupResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /servicios:
    get:
      tags: [Services]
      summary: Consultar catálogo
      operationId: listServices
      parameters:
        - name: categoria
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Servicios del catálogo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceOffering' }
    post:
      tags: [Services]
      summary: Registrar servicio
      operationId: createService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOfferingRequest' }
      responses:
        '201': { description: Servicio creado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /servicios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Services]
      summary: Consultar servicio
      operationId: getService
      responses:
        '200': { description: Servicio encontrado }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Services]
      summary: Actualizar servicio
      operationId: updateService
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOfferingRequest' }
      responses:
        '200': { description: Servicio actualizado }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Services]
      summary: Eliminar servicio
      operationId: deleteService
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Servicio eliminado }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /profesionales:
    get:
      tags: [ Professionals ]
      summary: Listar profesionales
      description: Lista los profesionales con los datos de su cuenta, ordenados por nombre. Solo ADMIN.
      operationId: listProfessionals
      security: [ { bearerAuth: [ ] } ]
      responses:
        '200':
          description: Profesionales registrados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProfessionalResponse' } }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [ Professionals ]
      summary: Registrar profesional
      description: >-
        Crea la cuenta del profesional con rol PROFESSIONAL y su perfil con la especialidad, en una sola
        operación. Solo puede usarlo un usuario con rol ADMIN (HU-22). Errores: 400 VALIDATION_ERROR,
        401 UNAUTHORIZED, 403 ACCESS_DENIED y 409 EMAIL_ALREADY_REGISTERED.
      operationId: createProfessional
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfessionalRequest' }
      responses:
        '201':
          description: Profesional creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfessionalResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /usuarios/buscar:
    get:
      tags: [ Users ]
      summary: Buscar usuarios por correo o nombre
      description: >-
        Solo ADMIN. Sirve para encontrar al usuario al que se le va a asignar un rol sin conocer su
        UUID de antemano. Con q vacío devuelve algunas sugerencias.
      operationId: searchUsers
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, default: '' }
      responses:
        '200':
          description: Usuarios encontrados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSearchResult' } }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /usuarios/{userId}/clave/restablecer:
    post:
      tags: [ Users ]
      summary: Restablecer la contraseña de un usuario a una temporal
      description: >-
        Solo ADMIN. No hay recuperación de contraseña por correo todavía (depende de notificaciones
        salientes al cliente, fuera del alcance de HU-10). El ADMIN debe entregar la contraseña
        temporal al usuario fuera de la plataforma.
      operationId: resetUserPassword
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Contraseña temporal generada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /usuarios/{userId}/rol:
    put:
      tags: [ Users ]
      summary: Asignar rol a un usuario
      description: >-
        Solo ADMIN. Cambia el rol de la cuenta entre CUSTOMER, PROFESSIONAL y ADMIN (HU-17). Para
        asignar PROFESSIONAL a una cuenta sin perfil se requiere la especialidad y se crea el perfil.
        Una cuenta con perfil profesional no puede cambiar a otro rol (409 ROLE_CHANGE_CONFLICT). El
        token que ya emitió el usuario conserva el rol anterior hasta que expire.
        Errores: 400 VALIDATION_ERROR, 401 UNAUTHORIZED, 403 ACCESS_DENIED, 404 USER_NOT_FOUND y 409
        ROLE_CHANGE_CONFLICT o SPECIALTY_REQUIRED.
      operationId: assignUserRole
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentRequest' }
      responses:
        '200':
          description: Rol asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /auditoria:
    get:
      tags: [ Audit ]
      summary: Consultar bitácora de auditoría
      description: >-
        Consulta las acciones críticas registradas para un rango de fechas. Solo ADMIN puede acceder.
        La respuesta se ordena por fecha de ocurrencia descendente y usa paginación determinista.
      operationId: listAuditLog
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio inclusivo del rango en formato ISO-8601.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Fin inclusivo del rango en formato ISO-8601.
          schema: { type: string, format: date-time }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Bitácora paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /horarios/{professionalId}:
    parameters:
      - name: professionalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [ Schedule ]
      summary: Consultar horario semanal del profesional
      description: >-
        Devuelve las franjas de atención del profesional. Solo el propio profesional o un ADMIN (HU-04).
        Errores: 401 UNAUTHORIZED, 403 ACCESS_DENIED y 404 PROFESSIONAL_NOT_FOUND.
      operationId: getSchedule
      security: [ { bearerAuth: [ ] } ]
      responses:
        '200':
          description: Horario del profesional
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [ Schedule ]
      summary: Reemplazar horario semanal del profesional
      description: >-
        Reemplaza todas las franjas del profesional en una sola operación. Rechaza franjas con hora fin
        anterior o igual a la de inicio, y franjas que se superponen el mismo día; la respuesta 409
        SCHEDULE_CONFLICT indica cada conflicto en details (HU-04). Franjas contiguas son válidas.
      operationId: replaceSchedule
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '200':
          description: Horario guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /disponibilidad:
    get:
      tags: [ Availability ]
      summary: Consultar disponibilidad de agenda de un profesional
      description: >-
        Devuelve los bloques libres de un profesional para un servicio dentro de un rango de fechas (HU-07).
        Cada bloque dura lo mismo que el servicio y se genera dentro de las franjas semanales del profesional.
        Se excluyen los bloques que ya pasaron y los que se solapan con reservas CONFIRMADA.
        Si no hay bloques libres responde 200 con available=false y un message que sugiere ampliar el filtro
        de fechas o elegir otro profesional. El rango máximo es de 31 días. Solo el rol CUSTOMER.
        Errores: 400 VALIDATION_ERROR, 401 UNAUTHORIZED, 404 PROFESSIONAL_NOT_FOUND o SERVICE_NOT_FOUND.
      operationId: getAvailability
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: profesionalId
          in: query
          required: true
          description: Identificador del profesional.
          schema: { type: string, format: uuid }
        - name: servicioId
          in: query
          required: true
          description: Identificador del servicio; su duración define el tamaño de cada bloque.
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          required: true
          description: Primer día del rango (inclusivo), formato yyyy-MM-dd.
          schema: { type: string, format: date, example: '2026-10-12' }
        - name: hasta
          in: query
          required: true
          description: Último día del rango (inclusivo), formato yyyy-MM-dd. Máximo 31 días desde `desde`.
          schema: { type: string, format: date, example: '2026-10-18' }
      responses:
        '200':
          description: Bloques libres del profesional, o mensaje informativo si no hay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /reservas:
    post:
      tags: [Reservas]
      summary: Crear una nueva reserva
      description: |
        Crea una nueva reserva para un cliente en una franja disponible.
        Si dos clientes intentan la misma franja simultáneamente, solo uno será confirmado.
        El otro recibe un error 409 CONFLICT.
      operationId: createBooking
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Reserva creada exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateBookingResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /reservas/cliente/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reservas]
      summary: Obtener todas las reservas de un cliente
      operationId: getByCustomer
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de reservas del cliente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /reservas/profesional/{professionalId}:
    parameters:
      - name: professionalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reservas]
      summary: Obtener todas las reservas de un profesional
      operationId: getByProfessional
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de reservas del profesional
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RoleAssignmentRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [CUSTOMER, PROFESSIONAL, ADMIN] }
        specialty: { type: string, maxLength: 100 }
    RoleAssignmentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [CUSTOMER, PROFESSIONAL, ADMIN] }
    ProfessionalRequest:
      type: object
      required: [email, password, fullName, specialty]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 8, maxLength: 64 }
        fullName: { type: string, maxLength: 150 }
        specialty: { type: string, maxLength: 100 }
    ProfessionalResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        specialty: { type: string }
        role: { type: string, enum: [CUSTOMER, PROFESSIONAL, ADMIN] }
        createdAt: { type: string, format: date-time }
    CreateBookingRequest:
      type: object
      required: [professionalId, serviceId, startTime, endTime]
      properties:
        professionalId: { type: string, format: uuid, description: "UUID del profesional" }
        serviceId: { type: string, format: uuid, description: "UUID del servicio" }
        startTime: { type: string, format: date-time, description: "Hora de inicio (ISO 8601, debe ser en el futuro)", example: "2026-10-15T10:00:00" }
        endTime: { type: string, format: date-time, description: "Hora de fin (ISO 8601, debe ser después de startTime)", example: "2026-10-15T10:45:00" }
    CreateBookingResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        professionalId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        status: { type: string, enum: [CONFIRMADA, CANCELADA, RESCHEDULED, COMPLETED] }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        professionalId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        status: { type: string, enum: [CONFIRMADA, CANCELADA, RESCHEDULED, COMPLETED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, x-nullable: true }
        cancellationReason: { type: string, x-nullable: true }
    ApiError:
      type: object
      required: [errorCode, message, details, traceId, timestamp]
      properties:
        errorCode: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: { type: string } }
        traceId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
    RegisterCustomerRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 8, maxLength: 64 }
        fullName: { type: string, maxLength: 150 }
    RegisterCustomerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [CUSTOMER, PROFESSIONAL, ADMIN] }
        createdAt: { type: string, format: date-time }
    LoginUserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [CUSTOMER, PROFESSIONAL, ADMIN] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 64 }
    MfaEnrollRequest:
      type: object
      required: [mfaToken]
      properties:
        mfaToken: { type: string }
    MfaVerifyRequest:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string }
        code: { type: string, maxLength: 20 }
        trustDevice: { type: boolean, default: false }
    MfaEnrollmentResponse:
      type: object
      properties:
        secret: { type: string, description: "Para ingresar manualmente si no se puede escanear el QR" }
        otpauthUri: { type: string, description: "Se renderiza como QR en el front" }
    MfaConfirmResponse:
      type: object
      properties:
        session: { $ref: '#/components/schemas/LoginResponse' }
        recoveryCodes: { type: array, items: { type: string }, description: "Se muestran una sola vez" }
    MfaRecoveryStatusResponse:
      type: object
      properties:
        remaining: { type: integer }
    MfaRegenerateRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    MfaRecoveryCodesResponse:
      type: object
      properties:
        recoveryCodes: { type: array, items: { type: string } }
    MfaDisableRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, format: password }
        code: { type: string }
    UserSearchResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [CUSTOMER, PROFESSIONAL, ADMIN] }
        hasProfessionalProfile: { type: boolean, description: "Si es true, el rol de esta cuenta ya no se puede cambiar" }
    PasswordResetResponse:
      type: object
      properties:
        temporaryPassword: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      description: >-
        Si mfaRequired es true, la sesión todavía no está autenticada: accessToken y user vienen
        en null, y hay que resolver el reto con mfaToken contra /auth/mfa/** antes de tener un
        accessToken real.
      properties:
        accessToken: { type: string, nullable: true }
        tokenType: { type: string, example: Bearer, nullable: true }
        expiresIn: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/LoginUserSummary', nullable: true }
        mfaRequired: { type: boolean, description: "true solo para ADMIN con MFA exigido" }
        mfaSetupRequired: { type: boolean, description: "true si el ADMIN todavía no tiene el segundo factor enrolado" }
        mfaToken: { type: string, nullable: true, description: "Token de corta duración para completar el reto de MFA" }
        deviceToken: { type: string, nullable: true, description: "Presente solo si se marcó 'confiar en este dispositivo'" }
    PlatformSetupRequest:
      type: object
      required: [name, adminEmail, adminPassword, adminFullName]
      properties:
        name: { type: string, maxLength: 200 }
        adminEmail: { type: string, format: email, maxLength: 320 }
        adminPassword: { type: string, format: password, minLength: 8, maxLength: 64 }
        adminFullName: { type: string, maxLength: 150 }
    PlatformSetupResponse:
      type: object
      properties:
        platformId: { type: string, format: uuid }
        name: { type: string }
        adminUserId: { type: string, format: uuid }
    ServiceOfferingRequest:
      type: object
      required: [name, category, durationMinutes, price]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 100 }
        durationMinutes: { type: integer, minimum: 1, maximum: 480 }
        price: { type: number, format: double, exclusiveMinimum: true }
        status: { type: string, enum: [ACTIVO, INACTIVO] }
    ServiceOffering:
      allOf:
        - $ref: '#/components/schemas/ServiceOfferingRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
    ScheduleRequest:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items: { $ref: '#/components/schemas/ScheduleSlot' }
    ScheduleSlot:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startTime: { type: string, format: time, example: '08:00' }
        endTime: { type: string, format: time, example: '12:00' }
    ScheduleResponse:
      type: object
      properties:
        professionalId: { type: string, format: uuid }
        slots:
          type: array
          items: { $ref: '#/components/schemas/ScheduleSlot' }
    AvailabilityBlock:
      type: object
      properties:
        startTime: { type: string, format: date-time, example: '2026-10-12T09:00:00' }
        endTime: { type: string, format: date-time, example: '2026-10-12T10:00:00' }
    AvailabilityDay:
      type: object
      properties:
        date: { type: string, format: date, example: '2026-10-12' }
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityBlock' }
    AvailabilityResponse:
      type: object
      properties:
        professionalId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        durationMinutes: { type: integer, minimum: 1 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        available: { type: boolean }
        message:
          type: string
          nullable: true
          description: Solo viene cuando no hay bloques libres; sugiere ampliar el filtro de fechas o elegir otro profesional.
        days:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityDay' }
    AuditLogPageResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        actionType: { type: string, enum: [BOOKING_CREATED, BOOKING_CANCELLED, ROLE_CHANGED] }
        resourceType: { type: string, enum: [BOOKING, USER] }
        resourceId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }
        sourceIp: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: { type: string } }
  responses:
    ValidationError: { description: Datos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ConflictError: { description: Conflicto de integridad o estado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    UnauthorizedError: { description: Autenticación requerida, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ForbiddenError: { description: Permisos insuficientes, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    LockedError: { description: Cuenta bloqueada, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFoundError: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
