spring.datasource.url=jdbc:h2:mem:backendcf;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
# Las migraciones son especificas de PostgreSQL (TIMESTAMPTZ, indice funcional);
# el esquema de pruebas lo genera Hibernate con ddl-auto=create-drop.
spring.flyway.enabled=false
