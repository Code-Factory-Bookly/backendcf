spring.application.name=backendcf
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backendcf}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
